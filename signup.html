<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — Afterlogue</title>

  <link rel="stylesheet" href="style.css?v=10">
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">afterlogue.</a>
  </header>

  <main class="signup-page">

    <section class="signup-container">

      <p class="signup-eyebrow">
        AFTERLOGUE / YOUR STORY
      </p>

      <h1>Make it yours.</h1>

      <p class="signup-description">
        Save your impressions.
        Discover what stays with you.
      </p>

      <div class="signup-options">

        <button type="button" class="signup-social" id="google-signin">
          Continue with Google
        </button>

        <button type="button" class="signup-social" id="apple-signin">
          Continue with Apple
        </button>

      </div>

      <div class="signup-divider">
        <span>or continue with email</span>
      </div>

      <form id="signup-form">

        <label for="signup-email">Email address</label>

        <input
          type="email"
          id="signup-email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

        <label for="signup-password">Password</label>

        <input
          type="password"
          id="signup-password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button type="submit" class="signup-submit">
          Create account →
        </button>

      </form>

      <p class="signup-login">
        Already have an account?
        <a href="#" id="signin-link">Sign in</a>
      </p>

      <p id="signup-message" role="status" aria-live="polite"></p>

    </section>

  </main>

<!-- AFTERLOGUE — SUPABASE CONNECTION -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
  const SUPABASE_URL = "https://lerrhzrabrqgogfnlsbd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4frMAHSyIeVNTbVC6umquQ_qsi-XAK4";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  console.log("Afterlogue: Supabase client initialized.");
  
/* AFTERLOGUE — EMAIL ACCOUNT CREATION */

const signupForm = document.getElementById("signup-form");
const signupMessage = document.getElementById("signup-message");

signupForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  const submitButton = signupForm.querySelector(".signup-submit");

  submitButton.disabled = true;
  submitButton.textContent = "Creating account...";
  signupMessage.textContent = "";

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        emailRedirectTo:
          "https://tamia-sys.github.io/Afterlogue/signup.html"
      }
    });

    if (error) {
      throw error;
    }

    if (data.session) {
      signupMessage.textContent =
        "Your account has been created successfully.";
    } else {
      signupMessage.textContent =
        "Check your email for a confirmation link to finish creating your account.";
    }

  } catch (error) {
    signupMessage.textContent =
      error.message || "Something went wrong. Please try again.";
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Create account →";
  }
});

</script>

</body>
</html>
