<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — Afterlogue</title>

  <script>
    // A verified guest briefly passes through this page to import saved
    // impressions. Hide the sign-in form before the browser first paints.
    if(new URLSearchParams(location.search).get("confirmed")==="1"){
      document.documentElement.classList.add("auth-confirmed-handoff");
    }
  </script>
  <style>
    .auth-handoff-status{display:none}
    html.auth-confirmed-handoff .signup-page{display:none}
    html.auth-confirmed-handoff .auth-handoff-status{
      display:grid;place-content:center;text-align:center;
      min-height:calc(100vh - 105px);padding:32px 20px;
      background:#101113;color:#f2e8d9
    }
    .auth-handoff-status h1{font:400 clamp(32px,5vw,46px)/1.15 Georgia,serif;margin:0 0 16px}
    .auth-handoff-status p{font:14px/1.6 Arial,sans-serif;color:#c6b6a1;margin:0}
  </style>
  <link rel="stylesheet" href="style.css?v=10">
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo" aria-label="Afterlogue — return to welcome page" title="Back to Afterlogue">afterlogue.</a>
  </header>

  <section class="auth-handoff-status" aria-live="polite" role="status">
    <div>
      <h1>Opening your story.</h1>
      <p>Preparing your Afterlogue impressions…</p>
    </div>
  </section>

  <main class="signup-page">

    <section class="signup-container">

      <p class="signup-eyebrow">
        AFTERLOGUE / YOUR STORY
      </p>

      <h1>Make it yours.</h1>

      <p class="signup-description">
        Save your impressions.
        Discover what stays with you.
      </p>

      <div class="signup-options">

        <button type="button" class="signup-social" id="google-signin">
          Continue with Google
        </button>

        <button type="button" class="signup-social" id="apple-signin">
          Continue with Apple
        </button>

      </div>

      <div class="signup-divider">
        <span>or continue with email</span>
      </div>

      <form id="signup-form">

        <label for="signup-email">Email address</label>

        <input
          type="email"
          id="signup-email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

        <label for="signup-password">Password</label>

        <input
          type="password"
          id="signup-password"
          autocomplete="new-password"
          minlength="8"
          required
          aria-describedby="password-help"
        >

        <p id="password-help" style="font:12px/1.45 Arial,sans-serif;color:#BDAF9B;margin:7px 0 15px">Use at least 8 characters to protect your account.</p>
        <button type="submit" class="signup-submit">
          Create account →
        </button>

      </form>

      <p class="signup-login">
        Already have an account?
        <a href="#" id="signin-link">Sign in</a>
      </p>
      



      <p id="signup-message" role="status" aria-live="polite"></p>
      <button type="button" id="signup-resend" hidden style="margin-top:10px;border:1px solid #c7aa82;border-radius:99px;background:transparent;color:#d4b487;padding:10px 15px;cursor:pointer">Resend confirmation</button>

    </section>

  </main>

<script src="auth-signup.js?v=7"></script>
</body>
</html>
