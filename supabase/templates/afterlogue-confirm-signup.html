<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your Afterlogue account</title>
</head>
<body style="margin:0;padding:32px 16px;background:#171614;color:#f4eadd;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:520px;width:100%;margin:auto;border-collapse:collapse;">
    <tr><td style="padding:18px 0 28px;">
      <span style="color:#f4eadd;font-family:Georgia,'Times New Roman',serif;font-size:30px;letter-spacing:-1px;">afterlogue.</span>
    </td></tr>
    <tr><td style="border-top:1px solid #5b4f42;padding:32px 0 0;">
      <p style="font-size:11px;letter-spacing:2px;font-weight:bold;color:#c4aa87;margin:0 0 16px;">ACCOUNT CONFIRMATION</p>
      <h1 style="font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:32px;line-height:1.2;margin:0 0 16px;color:#f4eadd;">One more step.</h1>
      <p style="font-size:15px;line-height:1.7;color:#d3c7b7;margin:0 0 24px;">
        Confirm your email address to finish creating your Afterlogue account.
      </p>
      <p style="margin:0 0 26px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 23px;border-radius:24px;text-decoration:none;background:#d8c9b5;color:#171614;font-size:14px;font-weight:bold;">Confirm email address &rarr;</a>
      </p>
      <p style="font-size:12px;line-height:1.7;color:#a99b8c;margin:0;">
        If you did not create an Afterlogue account, you can ignore this email.
      </p>
    </td></tr>
  </table>
</body>
</html>
