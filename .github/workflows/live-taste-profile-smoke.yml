name: Verify Live Taste Profile Metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-taste-profile-smoke.yml'
      - 'supabase/functions/afterlogue-catalog/index.ts'
      - 'recommendation-engine.js'
      - 'discover.html'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm production catalogue supplies safe Log metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const endpoint='https://lerrhzrabrqgogfnlsbd.supabase.co/functions/v1/afterlogue-catalog';
          const controller=new AbortController();
          const timeout=setTimeout(()=>controller.abort(),18000);
          try {
            const reply=await fetch(endpoint,{
              method:'POST',signal:controller.signal,
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({mode:'taste-features',
                keys:['tmdb-movie-550','tmdb-tv-1399','tmdb-movie-550']})
            });
            assert.equal(reply.status,200,'Production API must accept taste-features');
            const data=await reply.json();
            assert.ok(Array.isArray(data.items),'Response must have feature records');
            assert.equal(data.items.length,2,'Both publicly released titles must resolve');
            for(const key of ['tmdb-movie-550','tmdb-tv-1399']){
              const record=data.items.find(item=>item.key===key);
              assert.ok(record, 'Missing title: '+key);
              assert.ok(typeof record.title==='string'&&record.title.length>1);
              assert.ok(Array.isArray(record.genres)&&record.genres.length>0);
              assert.ok(Array.isArray(record.themes));
              assert.ok(Array.isArray(record.tones));
              for(const privateField of ['rating','user_id','private_note','email'])
                assert.ok(!(privateField in record),'Must not expose '+privateField);
            }
            console.log('PASS: 2 real TMDB records, genre evidence, no private fields.');
          } finally {clearTimeout(timeout);}
          NODE
