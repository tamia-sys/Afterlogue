name: Afterlogue Browser Checks

on:
  workflow_dispatch:
  # Validate unpublished changes using the pull request's own checkout.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/browser-checks.yml'
      - 'package.json'
      - 'playwright.config.cjs'
      - 'catalog-browser.js'
      - 'explore.html'
      - 'supabase-client.js'
      - 'site-navigation.js'
      - 'style.css'
      - 'my-log.js'
      - 'explore-facets.js'
      - 'film-details.html'
      - 'film-details.js'
      - 'signup.html'
      - 'auth-signup.js'
      - 'log.html'
      - 'discover.html'
      - 'onboarding-sync.js'
      - 'onboarding-catalog-search.js'
      - 'recommendation-engine.js'
      - 'supabase/functions/afterlogue-catalog/index.ts'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AFTERLOGUE_TEST_EMAIL: ${{ secrets.AFTERLOGUE_TEST_EMAIL }}
      AFTERLOGUE_TEST_PASSWORD: ${{ secrets.AFTERLOGUE_TEST_PASSWORD }}
    steps:
      - name: Checkout Afterlogue
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Check recommendation intelligence rules
        run: npm run test:rules
      - name: Verify evolving Log features with simulated TMDB
        run: node --experimental-strip-types --test tests/taste-features-edge.cjs
      - name: Check Fall mood ranking with simulated TMDB
        run: node --experimental-strip-types --test tests/fall-edge-behavior.test.cjs
      - name: Verify Winding Down discovery with simulated TMDB
        run: node --experimental-strip-types --test tests/winding-edge-discovery.test.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused browser checks
        run: npx playwright test tests/korean-home-shelf.spec.cjs tests/mood-prefetch-and-trailer.spec.cjs tests/mood-and-save-flow-repairs.spec.cjs tests/explore-return-and-exclusions.spec.cjs tests/pwa-session-navigation.spec.cjs tests/localized-discovery-polish.spec.cjs tests/confirmed-guest-save-handoff.spec.cjs tests/onboarding-guided-journey.spec.cjs
      # WebKit runs the same browser engine family as Safari. This is not an
      # iPhone device test, but catches web-engine playback regressions.
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Check Safari-family trailer interactions
        run: npx playwright test tests/mood-prefetch-and-trailer.spec.cjs --browser=webkit --grep "trailer|autoplay"
