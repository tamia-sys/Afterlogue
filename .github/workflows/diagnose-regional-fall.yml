name: Diagnose Public Regional Fall Film Titles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-regional-fall.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check published public Korean-film catalog records
        run: |
          node <<'NODE'
          const endpoint='https://lerrhzrabrqgogfnlsbd.supabase.co/functions/v1/afterlogue-catalog';
          const names=[
            'Little Forest','Art Museum by the Zoo','Love Wind Love Song','Il Mare',
            'Spring, Summer, Fall, Winter... and Spring','Traces of Love','Late Autumn'
          ];
          async function get(body){
            const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify(body),signal:AbortSignal.timeout(50000)});
            if(!r.ok)throw Error(body.mode+' '+body.query+' '+r.status);
            return r.json();
          }
          (async()=>{
            for(const name of names){
              const data=await get({mode:'search',media:'movie',query:name,page:1,pageSize:20});
              console.log('QUERY '+name+': '+(data.items||[]).slice(0,8)
                .map(x=>[x.id,x.title,x.year,x.poster?'poster':'no-poster'].join(' / ')).join(' | '));
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
