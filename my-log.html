
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log — Afterlogue</title>
  <link rel="stylesheet" href="style.css?v=25">
</head>

<body>
  <header>
    <h1>
      <a href="index.html" class="logo-link">afterlogue.</a>
    </h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="discover.html">Discover</a>
      <a href="my-log.html">Log</a>
    </nav>
  </header>

  <main class="personal-log">
    <p class="personal-log-eyebrow">
      AFTERLOGUE / 03 — YOUR COLLECTION
    </p>

    <h2 class="personal-log-title">Log.</h2>

    <p class="personal-log-description">
      The stories you've experienced, and those still waiting.
    </p>

    <div class="personal-log-divider"></div>

    <nav class="personal-log-tabs" aria-label="Log sections">
      <button type="button" class="personal-log-tab active" data-tab="watched">Watched</button>
      <button type="button" class="personal-log-tab" data-tab="watchlist">Watchlist</button>
      <button type="button" class="personal-log-tab" data-tab="favorites">Favorites</button>
    </nav>

<div class="log-category-selector" aria-label="Content type">
  <button
    type="button"
    class="log-category-btn active"
    data-category="movies"
    aria-pressed="true">
    Movies
  </button>

  <button
    type="button"
    class="log-category-btn"
    data-category="tv"
    aria-pressed="false">
    TV Shows
  </button>
</div>

    <section class="personal-log-panel" id="watched">
      <p>Your impressions will live here.</p>
    </section>

    <section class="personal-log-panel" id="watchlist" hidden>
      <p>Stories you've saved for later.</p>
    </section>

    <section class="personal-log-panel" id="favorites" hidden>
      <p>The stories you keep close.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
  <script>
    document.querySelectorAll(".personal-log-tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".personal-log-tab").forEach(tab => {
          tab.classList.toggle("active", tab === button);
        });

        document.querySelectorAll(".personal-log-panel").forEach(panel => {
          panel.hidden = panel.id !== button.dataset.tab;
        });
      });
    });
  </script>
  
<script>
  /* AFTERLOGUE — LOAD WATCHED IMPRESSIONS */

  async function loadWatchedImpressions() {
    const watched = document.getElementById("watched");
    watched.textContent = "Loading your impressions...";

    try {
      const client = window.afterlogueSupabase;

      const { data: userData, error: userError } =
        await client.auth.getUser();

      if (userError || !userData.user) {
        watched.textContent = "Please sign in to view your Log.";
        return;
      }

      const { data: impressions, error } = await client
        .from("impressions")
        .select("title_key, rating")
        .eq("user_id", userData.user.id)
        .order("title_key");

      if (error) throw error;

      watched.replaceChildren();

      if (!impressions || impressions.length === 0) {
        watched.textContent = "No impressions yet.";
        return;
      }

const posterLookup = new Map();

const response = await fetch("log.html");
if (response.ok) {
  const html = await response.text();
  const doc = new DOMParser().parseFromString(html, "text/html");

  doc.querySelectorAll(".log-film-card").forEach(card => {
    const title = card.querySelector("h4")?.textContent.trim();
    const poster = card.querySelector("img")?.getAttribute("src");

    if (title && poster) {
      const key = title.toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");

      posterLookup.set(key, poster);
    }
  });
}

      impressions.forEach(item => {
        const entry = document.createElement("p");

const tvTitles = new Set([
  "malcolm-in-the-middle",
  "abbott-elementary",
  "gilmore-girls",
  "insecure",
  "bridgerton",
  "gossip-girl",
  "stranger-things",
  "chernobyl",
  "demon-slayer",
  "avatar-the-last-airbender",
  "love-island-usa",
  "criminal-minds"
]);

entry.dataset.category = tvTitles.has(item.title_key)
  ? "tv"
  : "movies";

        const title = item.title_key
          .split("-")
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(" ");

        
const titleElement = document.createElement("div");
titleElement.className = "watched-title";
titleElement.textContent = title;

const impressionElement = document.createElement("div");
impressionElement.className = "watched-impression";

const impressionIcons = {
  "Loved": "♥",
  "Liked": "♡",
  "Okay": "●",
  "Not for me": "×"
};

const icon = impressionIcons[item.rating] || "•";
impressionElement.textContent = `${icon} ${item.rating}`;

entry.appendChild(titleElement);
entry.appendChild(impressionElement);

        
const poster = posterLookup.get(item.title_key);

if (poster) {
  const image = document.createElement("img");
  image.src = poster;
  image.alt = `${title} poster`;
  image.style.width = "140px";
  image.style.aspectRatio = "2 / 3";
  image.style.objectFit = "cover";
  image.style.display = "block";
  image.style.marginBottom = "10px";

  entry.prepend(image);
}

        watched.appendChild(entry);
      });

    } catch (error) {
      console.error("Log loading error:", error);
      watched.textContent =
        "Unable to load your impressions. Please refresh.";
    }
  }

 
/* AFTERLOGUE — LOG CATEGORY FILTER */

function filterWatchedCategory(category) {
  document.querySelectorAll("#watched > p[data-category]").forEach(entry => {
    entry.hidden = entry.dataset.category !== category;
  });
}

document.querySelectorAll(".log-category-btn").forEach(button => {
  button.addEventListener("click", () => {
    const category = button.dataset.category;

    document.querySelectorAll(".log-category-btn").forEach(btn => {
      const isActive = btn === button;
      btn.classList.toggle("active", isActive);
      btn.setAttribute("aria-pressed", String(isActive));
    });

    filterWatchedCategory(category);
  });
});

// Load saved impressions before applying the default filter.
loadWatchedImpressions().then(() => {
  filterWatchedCategory("movies");
});

</script>

</body>
</html>
