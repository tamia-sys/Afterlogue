
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afterlogue — There's always another story.</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>afterlogue.</h1>

    <nav>
      <a href="#home">Home</a>
      <a href="#explore">Explore</a>
      <a href="#log">Log</a>
      <a href="#discuss">Discuss</a>
    </nav>
  </header>

  <main id="home">
    <div class="hero-layout">
    <section class="hero">

      <h2>There's always another story.</h2>

      <p>
        Discover films beyond the familiar,
        shaped by your perspective.
      </p>

      <div class="hero-buttons">
        <a href="#discover" class="primary-button">
          Begin discovering
        </a>

        <a href="#explore" class="secondary-button">
          Explore films
        </a>
      </div>

    </section>
    
<section class="film-gallery" aria-label="Featured films">
  <div class="film-posters">

    
<div class="film-card">
  <img src="https://image.tmdb.org/t/p/original/3xbjL0z8iH8e8L3USyeKGQrBfuZ.jpg" alt="Waves poster">
</div>

<div class="film-card">
  <img src="https://www.themoviedb.org/t/p/w1280/5pt1MmQbv7y4iP3ekoe9e70cA2E.jpg" alt="Nomadland poster">
</div>

<div class="film-card featured">
  <img src="https://image.tmdb.org/t/p/original/eZvy4KiVoM2ZCD8oH0gMYR3mihi.jpg" alt="The Worst Person in the World poster">
</div>

<div class="film-card">
  <img src="https://image.tmdb.org/t/p/original/k1pnxBLlw7BfC0kzJgLom5shujh.jpg" alt="The Lost Daughter poster">
</div>

<div class="film-card">
  <img src="https://www.themoviedb.org/t/p/w1280/laxDxO6dAo46wP4mbu5vhyh87FL.jpg" alt="We Need to Talk About Kevin poster">
</div>


  </div>

  <div class="gallery-indicators" aria-hidden="true">
    <span></span>
    <span></span>
    <span class="active"></span>
    <span></span>
    <span></span>
  </div>
</section>
</div>
  </main>
<script>
  const posterRow = document.querySelector(".film-posters");

  if (posterRow) {
    const cards = [...posterRow.querySelectorAll(".film-card")];
    const centerImage = cards[2]?.querySelector("img");

    // Use the five movie posters already on the page
    const films = cards.map(card => {
      const image = card.querySelector("img");
      return {
        src: image.src,
        alt: image.alt
      };
    });

    let currentFilm = 2;

    if (centerImage && films.length === 5) {
      centerImage.style.transition = "opacity 1.5s ease";

      setInterval(() => {
        currentFilm = (currentFilm + 1) % films.length;

        const nextFilm = films[currentFilm];

        // Slowly fade out only the center poster
        centerImage.style.opacity = "0";

        setTimeout(() => {
          centerImage.src = nextFilm.src;
          centerImage.alt = nextFilm.alt;

          // Slowly fade in the next film
          centerImage.style.opacity = "1";
        }, 1500);
      }, 10000);
    }
  }
</script>
</body>
</html>
