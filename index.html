<section class="film-gallery" aria-label="Featured films">
  <div class="film-posters">

    
<div class="film-card">

  </div>

    <span></span>
    <span></span>
  </div>
</section>
</div>
  </main>
<script>
  const posterRow = document.querySelector(".film-posters");

  if (posterRow) {
    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    let isRotating = false;

    function rotatePosters() {
      if (isRotating) return;
      isRotating = true;

      const posters = [...posterRow.querySelectorAll(".film-card")];
      const firstPoster = posters[0];

      // Remember where the remaining posters started
      const oldPositions = new Map();

      posters.slice(1).forEach((poster) => {
        oldPositions.set(poster, poster.getBoundingClientRect());
      });

      // Hide the poster traveling from far left to far right
      firstPoster.style.visibility = "hidden";

      // Move it to the end of the row
      posterRow.appendChild(firstPoster);

      // Change which poster is featured
      const newOrder = [...posterRow.querySelectorAll(".film-card")];

      newOrder.forEach((poster, index) => {
        poster.classList.toggle("featured", index === 2);
      });

      if (reducedMotion.matches) {
        firstPoster.style.visibility = "";
        isRotating = false;
        return;
      }

      // Smoothly slide the other four posters left
      const animations = newOrder
        .filter((poster) => poster !== firstPoster)
        .map((poster) => {
          const oldPosition = oldPositions.get(poster);
          const newPosition = poster.getBoundingClientRect();

          return poster.animate(
            [
              {
                translate: `${oldPosition.left - newPosition.left}px ${oldPosition.top - newPosition.top}px`
              },
              {
                translate: "0px 0px"
              }
            ],
            {
              duration: 1200,
              easing: "ease-in-out"
            }
          );
        });

      // Reveal the far-right poster after the slide finishes
      Promise.all(animations.map(animation => animation.finished))
        .then(() => {
          firstPoster.style.visibility = "";
          isRotating = false;
        });
    }

    setInterval(rotatePosters, 6000);
  }
</script>
</body>
</html>
