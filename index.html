
<!DOCTYPE html>
<html lang="en">
<head>

<body>

  <header>

  <main id="home">

        Discover films beyond the familiar,
        shaped by your perspective.
      </p>

      <div class="hero-buttons">

    </section>
    
<section class="film-gallery" aria-label="Featured films">
  <div class="film-posters">

    
<div class="film-card">
  <img src="https://image.tmdb.org/t/p/original/3xbjL0z8iH8e8L3USyeKGQrBfuZ.jpg" alt="Waves poster">
</div>

<div class="film-card">

<div class="film-card featured">

<div class="film-card">

  </div>

  <div class="gallery-indicators" aria-hidden="true">
    <span></span>
    <span></span>
    <span class="active"></span>
    <span></span>
    <span></span>
  </div>
</section>
</div>
  </main>
<script>
  const posterRow = document.querySelector(".film-posters");

  if (posterRow) {
    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    function rotatePosters() {
      const posters = [...posterRow.querySelectorAll(".film-card")];

      // Remember where every poster is now
      const oldPositions = new Map();

      posters.forEach((poster) => {
        oldPositions.set(poster, poster.getBoundingClientRect());
      });

      // Move the first poster to the last position
      posterRow.appendChild(posters[0]);

      // Make the new center poster featured
      const newOrder = [...posterRow.querySelectorAll(".film-card")];

      newOrder.forEach((poster, index) => {
        poster.classList.toggle("featured", index === 2);
      });

      // Animate each poster from its old position to its new one
      if (!reducedMotion.matches) {
        newOrder.forEach((poster) => {
          const oldPosition = oldPositions.get(poster);
          const newPosition = poster.getBoundingClientRect();

          const moveX = oldPosition.left - newPosition.left;
          const moveY = oldPosition.top - newPosition.top;

          poster.animate(
            [
              { translate: `${moveX}px ${moveY}px` },
              { translate: "0px 0px" }
            ],
            {
              duration: 1200,
              easing: "ease-in-out"
            }
          );
        });
      }
    }

    setInterval(rotatePosters, 6000);
  }
</script>
</body>
</html>
