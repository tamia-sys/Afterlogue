<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discover — Afterlogue</title>

  <link rel="stylesheet" href="style.css?v=21">
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">afterlogue.</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="discover.html">Explore</a>
      <a href="log.html">Log</a>
      <a href="#">Discuss</a>
    </nav>
  </header>

  <main class="discover-page">

    <div class="discover-intro">

      <p class="discover-eyebrow">
        AFTERLOGUE / 02 — DISCOVERY
      </p>

   
      <p class="discover-description">
        Your impressions are just the beginning.
        There's always another story waiting to be discovered.
      </p>

    </div>
<section class="discovery-selections">

 <div class="discovery-section-header">

  <p>CURATED FOR YOU / 001</p>

  <h2>A place to begin.</h2>

</div>

  <p id="impression-count" class="discovery-count"></p>
<div class="discovery-category-buttons"
     role="group"
     aria-label="Choose what to discover">

  <button
    type="button"
    class="discovery-category active"
    data-category="movies"
    aria-pressed="true">
    Movies
  </button>

  <button
    type="button"
    class="discovery-category"
    data-category="tv"
    aria-pressed="false">
    TV Shows
  </button>

</div>
  <div class="discovery-results" id="discovery-results">
    <!-- Personalized recommendations will appear here. -->
  </div>
</section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const savedImpressions = {};

  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);

    if (key && key.startsWith("afterlogue-")) {
      savedImpressions[key] = localStorage.getItem(key);
    }
  }

  console.log("Afterlogue impressions:", savedImpressions);
  const impressionCount = Object.values(savedImpressions)
  .filter(rating => ["Loved", "Liked", "Okay", "Not for me"].includes(rating))
  .length;

document.getElementById("impression-count").textContent =
  impressionCount === 0
    ? "Your story begins here. Return to the Log to share your first impression."
    : `You've shared ${impressionCount} ${impressionCount === 1 ? "impression" : "impressions"}.`;
  // AFTERLOGUE — MOVIES / TV SHOWS SWITCHER

const categoryButtons = document.querySelectorAll(
  ".discovery-category"
);

let selectedCategory = "movies";

categoryButtons.forEach(button => {
  button.addEventListener("click", () => {

    selectedCategory = button.dataset.category;

    categoryButtons.forEach(otherButton => {
      const isSelected =
        otherButton.dataset.category === selectedCategory;

      otherButton.classList.toggle("active", isSelected);

      otherButton.setAttribute(
        "aria-pressed",
        String(isSelected)
      );
    });

    console.log("Selected category:", selectedCategory);

  });
});
  // AFTERLOGUE — PERSONALIZED DISCOVERY TEST

const discoveryLibrary = {
  movies: [
    {
      title: "The Farewell",
      year: 2019,
      poster: "images/posters/The%20Farewell.webp",
      matches: ["moonlight", "insecure", "gilmore-girls"],
      reason: "For stories about family, identity, and the things left unsaid."
    },
   {
  title: "Booksmart",
  year: 2019,
  poster: "images/posters/booksmart%20jpg.webp",
  matches: ["mean-girls", "little-miss-sunshine", "abbott-elementary"],
  reason: "For humor, friendship, and the beautiful mess of growing up."
},
   
{
  title: "Perfect Days",
  year: 2023,
  poster: "images/posters/Perfect%20Days.webp",
  matches: ["nomadland", "moonlight", "the-truman-show"],
  reason: "For quiet stories that find meaning in everyday life."
},

{
  title: "Past Lives",
  year: 2023,
poster: "images/posters/PastLives.webp",
  matches: ["moonlight", "the-truman-show", "gilmore-girls"],
  reason: "For tender stories about connection, timing, and the lives we might have lived."
},
{
  title: "Aftersun",
  year: 2022,
  poster: "images/posters/Aftersun.webp",
  matches: ["moonlight", "little-miss-sunshine", "the-truman-show"],
  reason: "For intimate stories about memory, love, and the things we understand only with time."
},
],
tv: [
    {
      title: "Mindhunter",
      year: 2017,
      poster: "images/posters/Mindhunter.webp",
      matches: ["criminal-minds", "get-out", "chernobyl"],
      reason: "For psychological tension, mysteries, and complex characters."
    },
    {
      title: "Fullmetal Alchemist: Brotherhood",
      year: 2009,
      poster: "images/posters/Fullmetal%20Alchemist.webp",
      matches: ["demon-slayer", "avatar-the-last-airbender"],
      reason: "For adventurous worlds, loyalty, and emotional storytelling."
    },
    {
      title: "Station Eleven",
      year: 2021,
      poster: "images/posters/Station%20Eleven.webp",
      matches: ["stranger-things", "chernobyl", "jurassic-park"],
      reason: "For imaginative stories about survival and human connection."
    }
  
{
  title: "Severance",
  year: 2022,
  poster: "images/posters/Severance.webp",
  matches: ["chernobyl", "stranger-things", "ex-machina"],
  reason: "For unsettling mysteries that question identity, control, and what it means to be human."
},
{
  title: "The Leftovers",
  year: 2014,
  poster: "images/posters/TheLeftovers.webp",
  matches: ["moonlight", "chernobyl", "insecure"],
  reason: "For emotionally rich stories about grief, faith, and the mysteries we cannot explain."
},

  ]
};

function getDiscoveryRecommendations(category) {
  return discoveryLibrary[category]
    .map(item => {
      let score = 0;

      item.matches.forEach(title => {
        const rating = savedImpressions["afterlogue-" + title];

        if (rating === "Loved") score += 3;
        if (rating === "Liked") score += 2;
        if (rating === "Okay") score += 0;
        if (rating === "Not for me") score -= 2;
      });

      return { ...item, score };
    })
   .sort((a, b) => b.score - a.score)
.slice(0, 5);
}

function displayDiscoveryRecommendations(category) {
  const container = document.getElementById("discovery-results");
  const selected = getDiscoveryRecommendations(category);

  container.replaceChildren();

  if (selected.length === 0) {
    const message = document.createElement("p");
    message.className = "discovery-empty";
    message.textContent =
      "Share a few more impressions in your Log to discover stories selected for you.";

    container.appendChild(message);
    return;
  }

  selected.forEach(item => {
  const card = document.createElement("article");
  card.className = "discovery-card";

  // Poster container
  const poster = document.createElement("button");
  poster.type = "button";
  poster.className = "discovery-poster";
  poster.setAttribute(
    "aria-label",
    `Why we recommend ${item.title}`
  );
  poster.setAttribute("aria-expanded", "false");

  // AFTERLOGUE — POSTER ARTWORK

const artwork = document.createElement("img");
artwork.src = item.poster || "";
artwork.alt = `${item.title} poster`;
artwork.className = "discovery-artwork";

if (!item.poster) {
  artwork.style.display = "none";
}

  // Description overlay
  const overlay = document.createElement("div");
  overlay.className = "discovery-reason";

  const label = document.createElement("span");
  label.className = "discovery-reason-label";
  label.textContent = "WHY THIS STORY";

  const explanation = document.createElement("span");
  explanation.className = "discovery-reason-text";
  explanation.textContent = item.reason;

  overlay.append(label, explanation);
  poster.append(artwork, overlay);

  // Tap to reveal or hide the description
  poster.addEventListener("click", () => {
    const isOpen = poster.classList.toggle("is-open");
    poster.setAttribute("aria-expanded", String(isOpen));
  });

  const title = document.createElement("h3");
  title.textContent = item.title;

  const year = document.createElement("p");
  year.className = "discovery-year";
  year.textContent = item.year;

  card.append(poster, title, year);
  container.appendChild(card);
});
}

// Display movie recommendations when the page first opens.
displayDiscoveryRecommendations("movies");

// Update the recommendations when a category is selected.
document.querySelectorAll(".discovery-category").forEach(button => {
  button.addEventListener("click", () => {
    displayDiscoveryRecommendations(button.dataset.category);
  });
});
  
/* AFTERLOGUE — LOAD ACCOUNT IMPRESSIONS */

async function loadAccountImpressions() {
  try {
    const client = window.afterlogueSupabase;

    const { data: userData, error: userError } =
      await client.auth.getUser();

    if (userError || !userData.user) {
      window.location.href = "signup.html";
      return;
    }

    const { data: impressions, error } = await client
      .from("impressions")
      .select("title_key, rating")
      .eq("user_id", userData.user.id);

    if (error) throw error;

    // Replace browser-based impressions with this account's data.
    Object.keys(savedImpressions).forEach(key => {
      delete savedImpressions[key];
    });

    const validRatings = ["Loved", "Liked", "Okay", "Not for me"];

    impressions.forEach(item => {
      if (validRatings.includes(item.rating)) {
        savedImpressions["afterlogue-" + item.title_key] = item.rating;
      }
    });

    const count = Object.keys(savedImpressions).length;

    document.getElementById("impression-count").textContent =
      `You've shared ${count} ${count === 1 ? "impression" : "impressions"}.`;

    // Refresh the currently selected recommendation category.
    const activeCategory =
      document.querySelector(".discovery-category.active")
        ?.dataset.category || "movies";

    displayDiscoveryRecommendations(activeCategory);

    console.log("Afterlogue: Account impressions loaded.");

  } catch (error) {
    console.error("Unable to load account impressions:", error);

    document.getElementById("impression-count").textContent =
      "We couldn't load your saved impressions. Please refresh the page.";
  }
}

loadAccountImpressions();

</script>
</body>
</html>
